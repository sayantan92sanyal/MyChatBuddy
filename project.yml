name: AIChatRouter
options:
  bundleIdPrefix: com.sayantan.aichatrouter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AIChatRouterKit:
    path: AIChatRouterKit

targets:
  AIChatRouter:
    type: application
    platform: macOS
    sources:
      - path: AIChatRouter
    dependencies:
      - package: AIChatRouterKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sayantan.aichatrouter.app
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: AIChatRouter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  AIChatRouter:
    build:
      targets:
        AIChatRouter: all
    run:
      config: Debug
    test:
      config: Debug
